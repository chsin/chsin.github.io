---
layout: default
---

<div class="row">
	<div class="col-md-9">
	{{ content }}
	</div>
	<div class="col-md-3">
	<center><h3>Posts</h3></center>
	<hr size=3 width="66%">
	<ul>
	{% for post in site.posts %}
	  <li> {{ post.date | date_to_string }} &raquo; <a href="{{ post.url }}"> <strong> {{ post.title }} </strong></a>
	  </li>
	{% endfor %}
	</ul>
	</div>
</div>
